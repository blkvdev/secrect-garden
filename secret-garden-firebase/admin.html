<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Secret Garden</title><link rel="stylesheet" href="styles.css"></head><body class="admin-bg"><header class="admin-header"><div class="container admin-nav"><b>Painel Secret Garden</b><span id="adminEmail"></span><a href="index.html">Ver loja</a><button id="logout">Sair</button></div></header><main class="container admin-main"><section class="stats"><article><strong id="statProducts">0</strong><span>Produtos</span></article><article><strong id="statPromos">0</strong><span>Promoções</span></article><article><strong id="statOrders">0</strong><span>Pedidos</span></article></section><nav class="tabs"><button class="active" data-tab="productsTab">Produtos</button><button data-tab="promosTab">Promoções</button><button data-tab="ordersTab">Pedidos</button></nav>
<section id="productsTab" class="tab active"><div class="panel"><h2 id="productTitle">Novo produto</h2><form id="productForm" class="form-grid"><input id="productId" type="hidden"><label>Nome<input id="name" required></label><label>Preço<input id="price" type="number" min="0" step="0.01" required></label><label>Categoria<select id="category"><option value="buques">Buquês</option><option value="flores">Flores</option><option value="plantas">Plantas</option></select></label><label>Estoque<input id="stock" type="number" min="0" value="0" required></label><label class="wide">URL da imagem<input id="image" type="url" placeholder="https://..."></label><label class="wide">Descrição<textarea id="desc" required></textarea></label><label class="check"><input id="featured" type="checkbox"> Mostrar nos destaques</label><div class="wide actions"><button class="button">Salvar produto</button><button type="button" id="cancelProduct">Cancelar edição</button></div></form></div><div id="productList" class="admin-list"></div></section>
<section id="promosTab" class="tab"><div class="panel"><h2>Nova promoção</h2><form id="promoForm" class="form-grid"><input id="promoId" type="hidden"><label>Título<input id="promoTitle" required></label><label>Desconto (%)<input id="discount" type="number" min="0" max="100" required></label><label>Data inicial<input id="startDate" type="date" required></label><label>Data final<input id="endDate" type="date" required></label><label class="wide">Descrição<textarea id="promoDesc" required></textarea></label><label class="check"><input id="promoActive" type="checkbox" checked> Ativa</label><div class="wide actions"><button class="button">Salvar promoção</button><button type="button" id="cancelPromo">Cancelar edição</button></div></form></div><div id="promoList" class="admin-list"></div></section>
<section id="ordersTab" class="tab"><div id="orderList" class="admin-list"></div></section></main><div id="toast" class="toast"></div><script type="module" src="admin.js"></script></body></html>
